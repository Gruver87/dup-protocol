name: Security checks

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements-runtime.txt
        run: pip-audit -r requirements-runtime.txt --desc on

  cargo-audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit native/abs_native
        # Scoped ignores: unused pyo3 APIs until Dependabot PR #7 (0.29) merges.
        # See .cargo/audit.toml + docs/DEPENDABOT_TRIAGE.md
        run: >
          cargo audit --file native/abs_native/Cargo.lock
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177

      - name: Audit bridge/rust_bridge
        run: >
          cargo audit --file bridge/rust_bridge/Cargo.lock
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177

  bridge-off-gate:
    name: Bridge OFF audit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Bridge OFF audit gate
        run: python scripts/bridge_off_audit_gate.py
