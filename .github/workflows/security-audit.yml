name: Security checks

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements-runtime.txt
        run: pip-audit -r requirements-runtime.txt --desc on

  cargo-audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit native/abs_native
        # Scoped ignores live in .cargo/audit.toml (owner/expiry). CLI mirrors for CI honesty.
        # Hot-path fixes: k256 0.14 / crypto-bigint, rustls 0.23.46, rustls-webpki>=0.103.16.
        # Remaining ignores: ADR 0020 libp2p transitive (hickory/gossipsub/quic/rendezvous).
        # See docs/DEPENDABOT_TRIAGE.md
        run: >
          cargo audit --file native/abs_native/Cargo.lock
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177
          --ignore RUSTSEC-2026-0119
          --ignore RUSTSEC-2025-0009
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0381
          --ignore RUSTSEC-2026-0382
          --ignore RUSTSEC-2026-0487
          --ignore RUSTSEC-2026-0489
          --ignore RUSTSEC-2026-0490
          --ignore RUSTSEC-2026-0491
          --ignore RUSTSEC-2026-0505
          --ignore RUSTSEC-2026-0511
          --ignore RUSTSEC-2026-0512
          --ignore RUSTSEC-2026-0514
          --ignore RUSTSEC-2026-0525
          --ignore RUSTSEC-2026-0526
          --ignore RUSTSEC-2026-0527
          --ignore RUSTSEC-2026-0530
          --ignore RUSTSEC-2026-0531
          --ignore RUSTSEC-2026-0534
          --ignore RUSTSEC-2026-0535
          --ignore RUSTSEC-2026-0536
          --ignore RUSTSEC-2026-0537
          --ignore RUSTSEC-2026-0550
          --ignore RUSTSEC-2026-0551

      - name: Audit bridge/rust_bridge
        run: >
          cargo audit --file bridge/rust_bridge/Cargo.lock
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177

  bridge-off-gate:
    name: Bridge OFF audit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bridge OFF audit gate
        run: python scripts/bridge_off_audit_gate.py
